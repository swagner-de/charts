{{- define "hardcoded" -}}
global:
  alwaysAppendIdentifierToResourceName: true
  createDefaultServiceAccount: false

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    containers:
      main:
        enabled: true
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        image:
          repository: docker.io/ghostfolio/ghostfolio
          tag: {{ .Chart.AppVersion | quote }}
        env:
          HOST: "0.0.0.0"
          PORT: "3333"
{{- if .Values.redis.enabled }}
          REDIS_HOST: {{ printf "%s-redis" .Release.Name | quote }}
          REDIS_PORT: "6379"
          REDIS_PASSWORD:
            valueFrom:
              secretKeyRef:
{{-   if and .Values.redis.auth.existingSecret .Values.redis.auth.existingSecretPasswordKey }}
                name: {{ .Values.redis.auth.existingSecret }}
                key: {{ .Values.redis.auth.existingSecretPasswordKey }}
{{-   else }}
                name: {{ printf "%s-redis" .Release.Name | quote }}
                key: redis-password
{{-   end }}
{{- end }}
{{- if .Values.cnpg.enabled }}
{{- $cnpgName := .Values.cnpg.clusterName }}
{{- if .Values.cnpg.prependReleaseName }}
{{- if contains .Chart.Name .Release.Name }}
{{- $cnpgName = printf "%s-%s" .Release.Name .Values.cnpg.clusterName }}
{{- else }}
{{- $cnpgName = printf "%s-%s-%s" .Release.Name .Chart.Name .Values.cnpg.clusterName }}
{{- end }}
{{- end }}
          POSTGRES_HOST:
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-app" $cnpgName | quote }}
                key: host
          POSTGRES_PORT:
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-app" $cnpgName | quote }}
                key: port
          POSTGRES_USER:
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-app" $cnpgName | quote }}
                key: user
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-app" $cnpgName | quote }}
                key: password
          POSTGRES_DB:
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-app" $cnpgName | quote }}
                key: dbname
          DATABASE_URL:
            dependsOn:
              - POSTGRES_USER
              - POSTGRES_PASSWORD
              - POSTGRES_HOST
              - POSTGRES_PORT
              - POSTGRES_DB
            value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?connect_timeout=300&sslmode=verify-ca&sslrootcert=/dbcerts/ca.crt"
{{- end }}
{{- range $k, $v := .Values.config }}
          {{ $k }}: {{ $v | quote }}
{{- end }}
{{- if or (not (empty .Values.appSecrets)) .Values.envFromSecrets }}
        envFrom:
{{-   if not (empty .Values.appSecrets) }}
          - secretRef:
              identifier: app
{{-   end }}
{{-   range .Values.envFromSecrets }}
          - secretRef:
              name: {{ .name }}
{{-   end }}
{{- end }}
        ports:
          - name: http
            containerPort: 3333
            protocol: TCP
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec: &probeSpec
              httpGet:
                path: /api/v1/health
                port: http
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              <<: *probeSpec
              initialDelaySeconds: 10
              failureThreshold: 60

service:
  main:
    controller: main
    primary: true
    ports:
      http:
        port: 3333
        targetPort: http
        protocol: HTTP

{{- if not (empty .Values.appSecrets) }}
secrets:
  app:
    enabled: true
    stringData: {{ toYaml .Values.appSecrets | nindent 6 }}
{{- end }}

persistence:
  tmp:
    enabled: true
    type: emptyDir
    advancedMounts:
      main:
        main:
        - path: /tmp
{{- if .Values.cnpg.enabled }}
{{- $cnpgName := .Values.cnpg.clusterName }}
{{- if .Values.cnpg.prependReleaseName }}
{{- if contains .Chart.Name .Release.Name }}
{{- $cnpgName = printf "%s-%s" .Release.Name .Values.cnpg.clusterName }}
{{- else }}
{{- $cnpgName = printf "%s-%s-%s" .Release.Name .Chart.Name .Values.cnpg.clusterName }}
{{- end }}
{{- end }}
  dbcerts:
    enabled: true
    type: secret
    name: {{ printf "%s-ca" $cnpgName }}
    advancedMounts:
      main:
        main:
          - path: /dbcerts/ca.crt
            subPath: ca.crt
{{- end }}

{{ end }}

{{- $ctx := deepCopy . -}}
{{- $_ := include "hardcoded" . | fromYaml | mergeOverwrite $ctx.Values -}}

{{ include "bjw-s.common.loader.all" $ctx }}
