misconfigurations:
  # The following exemptions apply ONLY to the backend container. The AdventureLog
  # backend image runs supervisord with nginx (binds :80), gunicorn, cron and
  # memcached (-u nobody) — cron and memcached must start as root and nginx serves
  # on a privileged port, so the container cannot run non-root or read-only.
  # The public-facing frontend container is fully hardened (non-root, read-only
  # root fs, all capabilities dropped, no privilege escalation).
  - id: KSV-0001
    statement: "AdventureLog backend (supervisord/nginx/cron/memcached) requires allowPrivilegeEscalation to drop privileges"
  - id: KSV-0003
    statement: "AdventureLog backend needs default capabilities (NET_BIND_SERVICE for nginx :80, SETUID/SETGID for memcached/cron)"
  - id: KSV-0012
    statement: "AdventureLog backend must run as root (cron and memcached -u nobody require it)"
  - id: KSV-0014
    statement: "AdventureLog backend requires a writable root filesystem (nginx, supervisord, cron runtime state)"
