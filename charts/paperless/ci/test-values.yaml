paperless:
  config:
    # not a real secret - only used to satisfy PAPERLESS_SECRET_KEY during ct install
    secret_key: ci-test-key-not-secret

cnpg:
  enabled: true
  clusterName: db
  prependReleaseName: true

postgres:
  enabled: false

rawResources:
  db:
    enabled: true
    manifest:
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      spec:
        instances: 1
        storage:
          size: 1Gi
