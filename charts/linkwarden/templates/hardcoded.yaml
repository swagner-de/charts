{{- define "hardcoded" -}}

{{ if and .Values.cnpg.enabled .Values.postgres.enabled }}
{{ fail "postgres cannot be used via the packaged subchart and CNPG at the same time" }}
{{- end }}

global:
  alwaysAppendIdentifierToResourceName: true
  createDefaultServiceAccount: false

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    containers:
      main:
        enabled: true
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        image:
          repository: ghcr.io/linkwarden/linkwarden
          tag: {{ .Chart.AppVersion | quote }}
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
        env:
{{- if .Values.meilisearch.enabled }}
          MEILI_HOST: {{ printf "http://%s-meilisearch:7700" .Release.Name | quote }}
{{- end }}
{{- if .Values.postgres.enabled }}
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-postgres" .Release.Name | quote }}
                key: uri
{{- end }}
{{- if .Values.cnpg.enabled }}
{{- $cnpgName := .Values.cnpg.clusterName }}
{{- if .Values.cnpg.prependReleaseName }}
{{- if contains .Chart.Name .Release.Name }}
{{- $cnpgName = printf "%s-%s" .Release.Name .Values.cnpg.clusterName }}
{{- else }}
{{- $cnpgName = printf "%s-%s-%s" .Release.Name .Chart.Name .Values.cnpg.clusterName }}
{{- end }}
{{- end }}
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: {{ printf "%s-app" $cnpgName | quote }}
                key: uri
{{- end }}
{{- range $k, $v := .Values.config }}
          {{ $k }}: {{ $v | quote }}
{{- end }}
        envFrom:
{{- if .Values.secrets.app.enabled }}
          - secretRef:
              identifier: app
{{- end }}
{{- range .Values.envFromSecrets }}
          - secretRef:
              name: {{ .name }}
{{- end }}
        probes:
          liveness: &probe
            enabled: true
            custom: true
            spec: &probeSpec
              httpGet:
                path: /
                port: 3000
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 5
              successThreshold: 1
              failureThreshold: 5
          readiness: *probe
          startup:
            enabled: true
            custom: true
            spec:
              <<: *probeSpec
              # tolerate prisma migrations running at container start
              initialDelaySeconds: 20
              failureThreshold: 30
{{- if .Values.meilisearch.enabled }}
  meilisearch:
    containers:
      main:
        enabled: true
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        image:
          repository: getmeili/meilisearch
          tag: v1.53.1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        env:
          MEILI_ENV: production
          MEILI_NO_ANALYTICS: "true"
          # Auto-migrate the on-disk index when the meilisearch image is bumped,
          # instead of crashlooping on a version-incompatible database. The index
          # is rebuilt from the app, so it can be recreated if a migration fails.
          MEILI_UPGRADE_DB: "true"
        envFrom:
{{- if .Values.secrets.app.enabled }}
          - secretRef:
              identifier: app
{{- end }}
{{- range .Values.envFromSecrets }}
          - secretRef:
              name: {{ .name }}
{{- end }}
        probes:
          liveness: &meiliProbe
            enabled: true
            custom: true
            spec: &meiliProbeSpec
              httpGet:
                path: /health
                port: 7700
              initialDelaySeconds: 10
              periodSeconds: 15
              timeoutSeconds: 5
              successThreshold: 1
              failureThreshold: 5
          readiness: *meiliProbe
          startup:
            enabled: true
            custom: true
            spec:
              <<: *meiliProbeSpec
              initialDelaySeconds: 5
              failureThreshold: 20
{{- end }}

service:
  main:
    controller: main
    primary: true
    ports:
      http:
        port: 3000
        protocol: HTTP
{{- if .Values.meilisearch.enabled }}
  meilisearch:
    controller: meilisearch
    ports:
      http:
        port: 7700
        protocol: HTTP
{{- end }}

ingress:
  main:
    enabled: false

secrets:
  app:
    enabled: {{ .Values.secrets.app.enabled }}
    stringData: {{ .Values.secrets.app.stringData | toYaml | nindent 6 }}

persistence:
  data:
    enabled: true
    advancedMounts:
      main:
        main:
        - path: /data/data
  tmp:
    type: emptyDir
    advancedMounts:
      main:
        main:
        - path: /tmp
  meili:
    enabled: {{ .Values.meilisearch.enabled }}
{{- if .Values.meilisearch.enabled }}
    advancedMounts:
      meilisearch:
        main:
        - path: /meili_data
  meili-tmp:
    type: emptyDir
    advancedMounts:
      meilisearch:
        main:
        - path: /tmp
{{- end }}

{{ end }}

{{- $ctx := deepCopy . -}}
{{- $_ := include "hardcoded" . | fromYaml | mergeOverwrite $ctx.Values -}}

{{ include "bjw-s.common.loader.all" $ctx }}
